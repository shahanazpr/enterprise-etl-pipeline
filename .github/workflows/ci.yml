name: CI Pipeline

on:
  push:
    branches: [ "main", "issue-17-github-actions" ]
  pull_request:
    branches: [ "main", "issue-17-github-actions" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Add a PostgreSQL service container here
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest email-validator

      - name: Run unit tests
        run: |
          pytest
        env:
          PYTHONPATH: ${{ github.workspace }}
          # Pass test database environment variables if your code uses them
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: 702526
          DB_NAME: test_db
          API_URL: https://api.example.com